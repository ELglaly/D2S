spring:
  application:
    name: schoolbridge-api
  autoconfigure:
    # Staff/parent auth is provided by SecurityConfig + (M4) JWT/parent-token filters.
    # Excluding the default in-memory UserDetailsService stops Spring Boot from logging a
    # generated password and from interfering with our stateless security chain.
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  ai:
    # Spring AI is the only LLM engine (ADR-007). The spring-ai-* model auto-configurations are
    # active-by-default (matchIfMissing=true) and instantiate a provider API eagerly, which fails
    # the context when no key is present ("simpleApiKey cannot be null"). Every model auto-config
    # is therefore pinned "none" below and chat is opt-in.
    model:
      # Chat provider for the assistant. "none" by default so the app starts with no LLM wiring at
      # all — matching schoolbridge.assistant.enabled=false. Set SPRING_AI_CHAT=openai (NVIDIA NIM /
      # DeepSeek, OpenAI-compatible, configured below) or another provider to turn it on, and set
      # that provider's key. Embedding stays "none" so RAG uses the in-process placeholder embedder
      # (dim 768) until real Vertex embeddings are wired at deploy time (docs/PLAN_SPRING_AI_RAG.md).
      chat: ${SPRING_AI_CHAT:none}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    # OpenAI-compatible chat model, pointed at NVIDIA NIM (DeepSeek) by default.
    # NOTE: the Spring AI OpenAI client appends "/v1/chat/completions", so base-url must NOT
    # include "/v1" — a base URL carrying a path gets that path replaced, not extended.
    # api-key is env-only and has NO default. Never inline a key here: this file is committed.
    openai:
      base-url: ${OPENAI_BASE_URL:https://integrate.api.nvidia.com}
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${ASSISTANT_MODEL:deepseek-ai/deepseek-v4-flash}
    # Phase 2 — PGVector store for assistant RAG. Liquibase owns the schema (changelog 013), so
    # initialize-schema MUST stay false. dimensions match the assistant_vector_store vector(768)
    # column and the embedding model (Vertex text-multilingual-embedding-002 / Phase-2 placeholder).
    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        table-name: assistant_vector_store
        dimensions: 768
  data:
    redis:
      repositories:
        # We only use RedisTemplate (idempotency cache, OTP, parent tokens), not Spring Data Redis
        # repositories; disabling the scanner silences the "strict mode" warning and prevents
        # accidental misclassification of JPA repositories.
        enabled: false
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # Announcement/attendance fan-out inserts one recipient row per (parent, student). Without
          # batching that is one network round trip per row — a 1,500-student school costs ~2,500
          # round trips inside a single HTTP request. Batching turns it into ~50.
          batch_size: 50
        order_inserts: true
        order_updates: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Application-specific configuration. Dev defaults below are overridden by env vars in prod.
schoolbridge:
  crypto:
    # 32-byte keys, base64-encoded. NO DEFAULT ON PURPOSE — startup fails if these are unset.
    # A default here would mean any profile that forgot to override it silently encrypts real
    # student PII under a key that is public in this repo, and the failure is invisible until a
    # breach. The throwaway dev values live in application-local.yml / application-test.yml;
    # prod supplies them from the environment (application-prod.yml).
    aes-key: ${AES_KEY}
    blind-index-key: ${BLIND_INDEX_KEY}
  jwt:
    # PEM-encoded RSA keypair. Blank in dev → JwtService generates ephemeral keys at startup
    # (tokens stop verifying after restart, which is fine for local development).
    private-key: ${JWT_PRIVATE_KEY:}
    public-key:  ${JWT_PUBLIC_KEY:}
    access-ttl:  15m
    refresh-ttl: 30d
    issuer:      schoolbridge
    kid:         dev
  idempotency:
    ttl: 24h
  outbox:
    relay:
      enabled: false
      poll-interval: 5s
      batch-size: 100
  whatsapp:
    api-base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v20.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    template:
      otp-name: ${WHATSAPP_TEMPLATE_OTP_NAME:parent_otp_v1}
      announcement-name: ${WHATSAPP_TEMPLATE_ANNOUNCEMENT_NAME:school_announcement_v1}
      attendance-absent-name: ${WHATSAPP_TEMPLATE_ATTENDANCE_ABSENT_NAME:attendance_absent_v1}
      attendance-late-name: ${WHATSAPP_TEMPLATE_ATTENDANCE_LATE_NAME:attendance_late_v1}
      attendance-excused-name: ${WHATSAPP_TEMPLATE_ATTENDANCE_EXCUSED_NAME:attendance_excused_v1}
      homework-reminder-name: ${WHATSAPP_TEMPLATE_HOMEWORK_REMINDER_NAME:homework_reminder_v1}
  rabbitmq:
    exchanges:
      announcements: schoolbridge.announcements
      otp: schoolbridge.otp
      attendance: schoolbridge.attendance
    queues:
      announcement-created: schoolbridge.whatsapp.announcement-created
      announcement-recalled: schoolbridge.whatsapp.announcement-recalled
      attendance-absent-alert: schoolbridge.whatsapp.attendance-absent-alert
      attendance-late-alert: schoolbridge.whatsapp.attendance-late-alert
      attendance-excused-alert: schoolbridge.whatsapp.attendance-excused-alert
  notification:
    fallback:
      # Number of consecutive WhatsApp failures within the window that flips a recipient to SMS.
      whatsapp-failure-threshold: 2
      whatsapp-failure-window: 10m
  push:
    fcm:
      # Set to true in prod and supply GOOGLE_APPLICATION_CREDENTIALS or credentials-file.
      enabled: ${PUSH_FCM_ENABLED:false}
      credentials-file: ${GOOGLE_APPLICATION_CREDENTIALS:}
  storage:
    # Attachment object store. S3-compatible: MinIO locally (see docker-compose.yml), S3 or R2 in
    # production, one endpoint override apart. User bytes never pass through this API — uploads are
    # presigned PUT and downloads are presigned GET, so a stored-XSS or sniffing bug in a
    # user-supplied file cannot execute in the API's security origin. docs/PLAN_FILE_UPLOAD.md.
    # access-key / secret-key are env-only with NO default, like the crypto keys: a default here
    # would let a profile that forgot to override it start against the wrong bucket.
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:schoolbridge-attachments}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    # MinIO on a bare host has no wildcard DNS, so the virtual-host form does not resolve.
    path-style-access: ${STORAGE_PATH_STYLE:true}
    max-upload-bytes: ${STORAGE_MAX_UPLOAD_BYTES:10485760}
    upload-url-ttl: 10m
    # A download URL is a bearer credential for a student's photo and survives being pasted into a
    # chat; it should expire before it can be usefully shared.
    download-url-ttl: 5m
    # Checked against the type SNIFFED from the stored bytes. The client's declared Content-Type
    # only has to agree with it — it is never the thing that is trusted.
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - application/pdf
    sniff-bytes: 4096
    av:
      # ClamAV over the clamd INSTREAM protocol. OFF by default so local dev and `mvn verify` do not
      # need the image and its signature-database startup. AvStartupValidator refuses to boot the
      # prod profile with this off — a security control that silently does nothing is worse than one
      # that is absent, because it is believed.
      enabled: ${STORAGE_AV_ENABLED:false}
      host: ${STORAGE_AV_HOST:localhost}
      port: ${STORAGE_AV_PORT:3310}
      timeout: 30s
    sweeper:
      # Deletes attachments abandoned mid-upload (a URL was issued and never used) and objects past
      # retention. Off in the default test profile, like the other sweepers.
      enabled: ${STORAGE_SWEEPER_ENABLED:true}
      cron: "0 15 3 * * *"
      abandoned-after: 24h
      retention: 365d
      batch-size: 200
  homework:
    sweeper:
      # Fires reminders for PUBLISHED items due within horizon-days when school-local time is
      # within ±reminder-window-minutes of the school's homeworkReminderTime setting.
      # Disabled in the default test profile — HomeworkReminderSweeperTest constructs the bean directly.
      enabled: true
      fire-cron: "0 */5 * * * *"
      reminder-window-minutes: 15
      reminder-horizon-days: 2
      deferred-release-rate: PT1M
      dedup-ttl: 36h
  attendance:
    sweeper:
      # Two scheduled responsibilities live in AttendanceSweeper:
      #  (1) release per-parent alert recipients held by quiet-hours (deferred-release-rate),
      #  (2) detect classes that have not had a roster submitted by the school's rosterDueByLocalTime
      #      and emit an attendance.roster_missed outbox event (missed-roster-cron).
      # Disabled in the default test profile so unrelated tests don't trip @Scheduled timing.
      enabled: true
      deferred-release-rate: PT1M
      missed-roster-cron: "0 */15 * * * *"
      missed-roster-dedup-ttl: 36h
  rate-limit:
    # Blanket per-caller cap across the API (RateLimitInterceptor). Targeted limiters — login per email,
    # OTP per phone — stay in place; this is the backstop for everything else.
    enabled: ${RATE_LIMIT_ENABLED:true}
    authenticated-per-minute: ${RATE_LIMIT_AUTHENTICATED:120}
    anonymous-per-minute: ${RATE_LIMIT_ANONYMOUS:20}
  otp:
    # Caps OTP *requests* per phone. Each request costs a real WhatsApp template or SMS send, so an
    # unlimited endpoint is an unbounded bill plus a WABA quality-rating risk.
    max-requests-per-hour: ${OTP_MAX_PER_HOUR:3}
    max-requests-per-day: ${OTP_MAX_PER_DAY:10}
  announcements:
    sweeper:
      # Releases SCHEDULED announcements once scheduledFor arrives. Without this, scheduling is
      # decorative — see AnnouncementScheduleSweeper.
      enabled: ${ANNOUNCEMENT_SWEEPER_ENABLED:true}
      release-rate: PT1M
      batch-size: 100
  assistant:
    # Natural-language assistant. SHIPS DARK, and the defaults below actually say so:
    # enabled=false keeps every LLM bean unloaded (AssistantConfig supplies DisabledLlmGateway);
    # actions.enabled=false keeps mutating tools off even when reads are live;
    # rag.enabled=false keeps retrieval out of the chat flow.
    # Turning this on is an explicit, per-environment opt-in — see ADR-007. It also sends tool
    # results (student names, attendance, grades) to a third-party inference endpoint, so it needs
    # a data-processing decision before it is enabled anywhere real.
    enabled: ${ASSISTANT_ENABLED:false}
    # There is NO engine or provider property. Spring AI is the only engine (ADR-007); the provider
    # and its api-key live under spring.ai.* above, so there is exactly one home for the key.
    # NVIDIA NIM returns a plain "404 page not found" for an unknown model id on /chat/completions —
    # confirm the id via GET /v1/models, not by reading the URL back.
    model: ${ASSISTANT_MODEL:deepseek-ai/deepseek-v4-flash}
    max-tool-iterations: 3
    request-timeout: 120s
    max-tokens: 1024
    read-cache-ttl: PT24H
    max-question-length: 500
    # Conversation context window: how many of the most recent stored messages are replayed to the
    # model on each turn of POST /conversations/{id}/messages.
    max-history-messages: 16
    # Max array elements kept in a tool result before it is capped (with a "narrow your query"
    # marker) on the way to the model. Identifiers are stripped from tool results regardless.
    tool-result-max-items: 50
    # Gate the advertised tool catalog to the domains the user's message touches (keyword-based,
    # falls back to the full catalog when no domain matches). Cuts input tokens on large catalogs.
    tool-gating-enabled: true
    # Optional tenant-agnostic default persona. Blank → built-in persona. A per-school row in
    # assistant_settings overrides this; the security guardrails are always appended regardless.
    default-system-prompt: ${ASSISTANT_SYSTEM_PROMPT:}
    actions:
      # Second kill-switch: mutating tools (write attendance, grades, homework, classes, students,
      # announcements). Off by default and cut from the v1 surface entirely — ADR-007.
      enabled: ${ASSISTANT_ACTIONS_ENABLED:false}
      confirmation-ttl: PT5M
      destructive-require-typed-confirm: true
      max-bulk-impact: 200
    # Retrieval-Augmented Generation (Phase 2 infra). Ships dark: enabled=false keeps retrieval out of
    # the chat flow (wired in Phase 3). Ingestion + the vector store load regardless so documents can
    # be indexed ahead of go-live. embedding-dim must equal the vector(768) column.
    rag:
      enabled: ${ASSISTANT_RAG_ENABLED:false}
      top-k: 3
      min-score: 0.70
      max-context-chars: 3000
      embedding-dim: 768
      chunk-size-tokens: 600
      chunk-overlap-tokens: 80

resilience4j:
  circuitbreaker:
    instances:
      whatsapp:
        registerHealthIndicator: false
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
      assistant:
        registerHealthIndicator: false
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      assistant:
        timeoutDuration: 120s
        cancelRunningFuture: true
  retry:
    instances:
      whatsapp:
        maxAttempts: 3
        waitDuration: 250ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        retryExceptions:
          - com.schoolbridge.api.integrations.whatsapp.WhatsAppRetryableException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0

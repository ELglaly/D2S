spring:
  application:
    name: schoolbridge-api
  autoconfigure:
    # Staff/parent auth is provided by SecurityConfig + (M4) JWT/parent-token filters.
    # Excluding the default in-memory UserDetailsService stops Spring Boot from logging a
    # generated password and from interfering with our stateless security chain.
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  ai:
    # Spring AI migration — Phase 0. The spring-ai-* starters are on the classpath but their model
    # auto-configurations are active-by-default (matchIfMissing=true) and instantiate a provider API
    # eagerly, which fails the context when no key is present ("simpleApiKey cannot be null"). Disable
    # every model auto-config here so the app keeps using the existing native LlmGateway. Phase 1's
    # SpringAiModelConfig flips the selected provider back on only when engine=springai.
    model:
      # engine=springai routes chat through this Spring AI model. Default "openai" = NVIDIA NIM /
      # DeepSeek (OpenAI-compatible) via spring.ai.openai below. Set SPRING_AI_CHAT=none to fully
      # disable Spring AI chat (e.g. when reverting to engine=native). Embedding stays "none" so RAG
      # uses the in-process placeholder embedder (dim 768) until real Vertex embeddings are wired at
      # deploy time (see docs/PLAN_SPRING_AI_RAG.md §16).
      chat: ${SPRING_AI_CHAT:openai}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    # OpenAI-compatible chat model. Defaults point at NVIDIA NIM (DeepSeek), reusing the same nvapi
    # key + host as the native deepseek gateway, so engine=springai works out of the box. NOTE: the
    # Spring AI OpenAI client appends "/v1/chat/completions", so base-url must NOT include "/v1".
    openai:
      base-url: ${OPENAI_BASE_URL:https://integrate.api.nvidia.com}
      api-key: ${OPENAI_API_KEY:${DEEPSEEK_API_KEY:[REDACTED_PROVIDER_TOKEN]}}
      chat:
        options:
          model: ${ASSISTANT_MODEL:deepseek-ai/deepseek-v4-flash}
    # Phase 2 — PGVector store for assistant RAG. Liquibase owns the schema (changelog 013), so
    # initialize-schema MUST stay false. dimensions match the assistant_vector_store vector(768)
    # column and the embedding model (Vertex text-multilingual-embedding-002 / Phase-2 placeholder).
    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        table-name: assistant_vector_store
        dimensions: 768
  data:
    redis:
      repositories:
        # We only use RedisTemplate (idempotency cache, OTP, parent tokens), not Spring Data Redis
        # repositories; disabling the scanner silences the "strict mode" warning and prevents
        # accidental misclassification of JPA repositories.
        enabled: false
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Application-specific configuration. Dev defaults below are overridden by env vars in prod.
schoolbridge:
  crypto:
    # 32-byte keys, base64-encoded. DEV ONLY defaults — always override in prod.
    aes-key: ${AES_KEY:c2Nob29sYnJpZGdlLWRldi1hZXMta2V5LTMyYnl0ZXM=}
    blind-index-key: ${BLIND_INDEX_KEY:c2Nob29sYnJpZGdlLWRldi1ibGluZC1pbmRleC1rZXk=}
  jwt:
    # PEM-encoded RSA keypair. Blank in dev → JwtService generates ephemeral keys at startup
    # (tokens stop verifying after restart, which is fine for local development).
    private-key: ${JWT_PRIVATE_KEY:}
    public-key:  ${JWT_PUBLIC_KEY:}
    access-ttl:  15m
    refresh-ttl: 30d
    issuer:      schoolbridge
    kid:         dev
  idempotency:
    ttl: 24h
  outbox:
    relay:
      enabled: false
      poll-interval: 5s
      batch-size: 100
  whatsapp:
    api-base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v20.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    template:
      otp-name: ${WHATSAPP_TEMPLATE_OTP_NAME:parent_otp_v1}
      announcement-name: ${WHATSAPP_TEMPLATE_ANNOUNCEMENT_NAME:school_announcement_v1}
      attendance-absent-name: ${WHATSAPP_TEMPLATE_ATTENDANCE_ABSENT_NAME:attendance_absent_v1}
      attendance-late-name: ${WHATSAPP_TEMPLATE_ATTENDANCE_LATE_NAME:attendance_late_v1}
      attendance-excused-name: ${WHATSAPP_TEMPLATE_ATTENDANCE_EXCUSED_NAME:attendance_excused_v1}
      homework-reminder-name: ${WHATSAPP_TEMPLATE_HOMEWORK_REMINDER_NAME:homework_reminder_v1}
  rabbitmq:
    exchanges:
      announcements: schoolbridge.announcements
      otp: schoolbridge.otp
      attendance: schoolbridge.attendance
    queues:
      announcement-created: schoolbridge.whatsapp.announcement-created
      announcement-recalled: schoolbridge.whatsapp.announcement-recalled
      attendance-absent-alert: schoolbridge.whatsapp.attendance-absent-alert
      attendance-late-alert: schoolbridge.whatsapp.attendance-late-alert
      attendance-excused-alert: schoolbridge.whatsapp.attendance-excused-alert
  notification:
    fallback:
      # Number of consecutive WhatsApp failures within the window that flips a recipient to SMS.
      whatsapp-failure-threshold: 2
      whatsapp-failure-window: 10m
  push:
    fcm:
      # Set to true in prod and supply GOOGLE_APPLICATION_CREDENTIALS or credentials-file.
      enabled: ${PUSH_FCM_ENABLED:false}
      credentials-file: ${GOOGLE_APPLICATION_CREDENTIALS:}
  homework:
    sweeper:
      # Fires reminders for PUBLISHED items due within horizon-days when school-local time is
      # within ±reminder-window-minutes of the school's homeworkReminderTime setting.
      # Disabled in the default test profile — HomeworkReminderSweeperTest constructs the bean directly.
      enabled: true
      fire-cron: "0 */5 * * * *"
      reminder-window-minutes: 15
      reminder-horizon-days: 2
      deferred-release-rate: PT1M
      dedup-ttl: 36h
  attendance:
    sweeper:
      # Two scheduled responsibilities live in AttendanceSweeper:
      #  (1) release per-parent alert recipients held by quiet-hours (deferred-release-rate),
      #  (2) detect classes that have not had a roster submitted by the school's rosterDueByLocalTime
      #      and emit an attendance.roster_missed outbox event (missed-roster-cron).
      # Disabled in the default test profile so unrelated tests don't trip @Scheduled timing.
      enabled: true
      deferred-release-rate: PT1M
      missed-roster-cron: "0 */15 * * * *"
      missed-roster-dedup-ttl: 36h
  assistant:
    # Natural-language assistant. Ships dark: enabled=false keeps the LLM beans unloaded;
    # actions.enabled=false keeps mutating tools off even when reads are live.
    enabled: ${ASSISTANT_ENABLED:true}
    # LLM engine: "native" (the hand-written Anthropic/Gemini/DeepSeek gateways, default) or
    # "springai" (the Spring AI ChatModel gateway). When springai, also set spring.ai.model.chat to
    # the provider (e.g. anthropic) and its api-key; the native gateways stay off.
    engine: ${ASSISTANT_ENGINE:springai}
    # Provider selection: "anthropic" (default), "gemini", or "deepseek". Only the selected
    # provider's beans load.
    provider: ${ASSISTANT_PROVIDER:deepseek}
    # Anthropic — env-only; validated at startup when provider=anthropic and enabled=true.
    api-key: ${ANTHROPIC_API_KEY:}
    # Gemini (Google AI Studio) — env-only; validated at startup when provider=gemini and enabled=true.
    gemini-api-key: ${GEMINI_API_KEY:}
    # DeepSeek via NVIDIA NIM (OpenAI-compatible) — env-only key; validated at startup when
    # provider=deepseek and enabled=true. Set DEEPSEEK_API_KEY to the nvapi-* key. To target
    # DeepSeek's own API instead, set DEEPSEEK_BASE_URL=https://api.deepseek.com and an sk-* key.
    deepseek-api-key: ${DEEPSEEK_API_KEY:[REDACTED_PROVIDER_TOKEN]}
    deepseek-base-url: ${DEEPSEEK_BASE_URL:https://integrate.api.nvidia.com/v1}
    # Default model per provider: anthropic → claude-haiku-4-5-20251001, gemini → gemini-2.0-flash,
    # deepseek (NVIDIA NIM) → deepseek-ai/deepseek-v4-flash (this key also serves
    # deepseek-ai/deepseek-v4-pro). NOTE: NVIDIA returns a plain "404 page not found" for an unknown
    # model id on /chat/completions — confirm the id via GET /v1/models, not the URL.
    model: ${ASSISTANT_MODEL:deepseek-ai/deepseek-v4-flash}
    max-tool-iterations: 4
    request-timeout: 120s
    max-tokens: 1024
    read-cache-ttl: PT24H
    max-question-length: 500
    # Conversation context window: how many of the most recent stored messages are replayed to the
    # model on each turn of POST /conversations/{id}/messages.
    max-history-messages: 40
    # Optional tenant-agnostic default persona. Blank → built-in persona. A per-school row in
    # assistant_settings overrides this; the security guardrails are always appended regardless.
    default-system-prompt: ${ASSISTANT_SYSTEM_PROMPT:}
    actions:
      enabled: ${ASSISTANT_ACTIONS_ENABLED:true}
      confirmation-ttl: PT5M
      destructive-require-typed-confirm: true
      max-bulk-impact: 200
    # Retrieval-Augmented Generation (Phase 2 infra). Ships dark: enabled=false keeps retrieval out of
    # the chat flow (wired in Phase 3). Ingestion + the vector store load regardless so documents can
    # be indexed ahead of go-live. embedding-dim must equal the vector(768) column.
    rag:
      enabled: ${ASSISTANT_RAG_ENABLED:true}
      top-k: 5
      min-score: 0.65
      max-context-chars: 6000
      embedding-dim: 768
      chunk-size-tokens: 600
      chunk-overlap-tokens: 80

resilience4j:
  circuitbreaker:
    instances:
      whatsapp:
        registerHealthIndicator: false
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
      assistant:
        registerHealthIndicator: false
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      assistant:
        timeoutDuration: 120s
        cancelRunningFuture: true
  retry:
    instances:
      whatsapp:
        maxAttempts: 3
        waitDuration: 250ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        retryExceptions:
          - com.schoolbridge.api.integrations.whatsapp.WhatsAppRetryableException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0

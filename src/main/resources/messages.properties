# Default (English) message bundle.
# Locale-specific strings live in messages_en.properties / messages_ar.properties.
error.internal=An unexpected error occurred. Please try again later.
error.validation=Validation failed.
error.not_found=The requested resource was not found.
error.unauthorized=Authentication is required.
error.forbidden=You do not have permission to perform this action.
error.conflict=The request conflicts with the current state of the resource.
error.rate_limited=Too many requests. Please slow down and try again later.

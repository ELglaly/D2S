spring:
  # DB_USERNAME must be the least-privilege application role, NOT the role that owns the tables.
  # PostgreSQL lets a table owner bypass row-level security, so connecting as the owner silently
  # disables every changelog-017 tenant-isolation policy. RlsStartupValidator refuses to boot this
  # profile if that happens. Role setup: docs/RUNBOOK.md, "Database roles".
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
  # Migrations need DDL and therefore run as the owner, which is exactly the privilege the runtime
  # role must not have. Two identities, one database.
  liquibase:
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

schoolbridge:
  crypto:
    aes-key: ${AES_KEY}
    blind-index-key: ${BLIND_INDEX_KEY}
  outbox:
    relay:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}

logging:
  level:
    root: INFO
    com.schoolbridge: INFO

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

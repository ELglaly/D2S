spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/schoolbridge
    username: postgres
    password: wasla
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: schoolbridge
    password: schoolbridge
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

schoolbridge:
  crypto:
    # Throwaway 32-byte dev keys, base64-encoded. Safe to commit ONLY because this profile is
    # expected to run against a local disposable database. Never point the local profile at data
    # you care about — these values are public in this repo.
    aes-key: ${AES_KEY:c2Nob29sYnJpZGdlLWRldi1hZXMta2V5LTMyYnl0ZXM=}
    blind-index-key: ${BLIND_INDEX_KEY:c2Nob29sYnJpZGdlLWRldi1ibGluZC1pbmRleC1rZXk=}
  whatsapp:
    # Meta credentials are env-only — NEVER inline them here, this file is committed.
    # Export WHATSAPP_ACCESS_TOKEN / WHATSAPP_PHONE_NUMBER_ID / WHATSAPP_APP_SECRET to activate
    # real sends. Leave them unset and the app uses LoggingWhatsAppClient (logs only, no network).
    # Get these from: https://developers.facebook.com → Your App → WhatsApp → API Setup
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:schoolbridge-local}
    # For testing before /custom templates are approved, Meta provides a free "hello_world" template.
    # Once your custom templates are approved, the defaults below are correct.
    template:
      otp-name: ${WHATSAPP_TEMPLATE_OTP:parent_otp_v1}
      announcement-name: ${WHATSAPP_TEMPLATE_ANNOUNCEMENT:school_announcement_v1}
      attendance-absent-name: ${WHATSAPP_TEMPLATE_ABSENT:attendance_absent_v1}
      attendance-late-name: ${WHATSAPP_TEMPLATE_LATE:attendance_late_v1}
      attendance-excused-name: ${WHATSAPP_TEMPLATE_EXCUSED:attendance_excused_v1}

logging:
  level:
    com.schoolbridge: DEBUG
